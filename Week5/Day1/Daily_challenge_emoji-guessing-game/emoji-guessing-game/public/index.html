
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Emoji Guessing Game</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Header -->
        <header class="header">
            <h1>🎯 Emoji Guessing Game</h1>
            <p>Can you guess the correct emoji?</p>
        </header>


        <!-- Player Registration -->
        <section id="startSection" class="card">

            <h2>Welcome to the game!</h2>

            <p>Enter your name to start playing.</p>

            <form id="startForm">

                <input
                    type="text"
                    id="playerName"
                    placeholder="Enter your name"
                    maxlength="20"
                    required
                >

                <button type="submit">
                    Start Game 🚀
                </button>

            </form>

            <p id="startMessage" aria-live="polite"></p>

        </section>


        <!-- Game Section -->
        <section id="gameSection" hidden>

            <div class="game-layout">

                <!-- Game Card -->
                <div class="card game-card">

                    <div class="game-header">

                        <div>
                            <p>Player</p>
                            <h2 id="displayName">Player</h2>
                        </div>

                        <div class="score-box">
                            <p>Your Score</p>
                            <strong>
                                🏆 <span id="scoreValue">0</span>
                            </strong>
                        </div>

                    </div>


                    <div class="emoji-area">

                        <p>Guess this emoji!</p>

                        <div id="emojiDisplay" class="emoji-display">
                            ❓
                        </div>

                    </div>


                    <!-- Guess Form -->
                    <form id="guessForm">

                        <fieldset>

                            <legend>What does this emoji mean?</legend>

                            <div
                                id="optionsContainer"
                                class="options-grid"
                            >
                            </div>

                        </fieldset>

                        <button
                            type="submit"
                            id="submitGuess"
                        >
                            Submit Answer
                        </button>

                    </form>


                    <!-- Feedback -->
                    <p
                        id="feedback"
                        class="feedback"
                        aria-live="polite"
                    ></p>


                    <!-- Next Emoji Button -->
                    <button
                        type="button"
                        id="nextButton"
                        hidden
                    >
                        Next Emoji ➜
                    </button>

                </div>


                <!-- Leaderboard -->
                <aside class="card leaderboard">

                    <h2>🏆 Leaderboard</h2>

                    <p>Top 10 players</p>

                    <ol id="leaderboardList">
                        <li>No players yet.</li>
                    </ol>

                </aside>

            </div>


            <!-- Change Player -->
            <button
                type="button"
                id="changePlayer"
                class="secondary-button"
            >
                Change Player
            </button>

        </section>

    </main>


    <!-- JavaScript -->
    <script src="app.js"></script>

</body>

</html>
